<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Users</h1>
      <button type="button" class="btn btn-brand" id="newUserBtn">+ New user</button>
    </div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" id="search" class="form-control" placeholder="Search by name or email">
      </div>
      <div class="col-md-3">
        <select id="roleFilter" class="form-select">
          <option value="">All roles</option>
          <option value="admin">Admin</option>
          <option value="organiser">Organiser</option>
          <option value="staff">Staff</option>
          <option value="customer">Customer</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
      </div>
    </form>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading users...</p>
    </div>
    <div id="empty" class="text-center py-5 text-secondary d-none">No users found.</div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white d-none" id="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="mt-3 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <span id="pageInfo" class="text-secondary"></span>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
    </nav>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="formTitle">New user</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="formMessage" class="alert d-none" role="alert"></div>
          <form id="userForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" maxlength="255" required>
              <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
              <div class="invalid-feedback" id="emailError"></div>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone <span class="text-secondary">(optional)</span></label>
              <input type="tel" class="form-control" id="phone" maxlength="20">
              <div class="invalid-feedback" id="phoneError"></div>
            </div>
            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select class="form-select" id="role" required>
                <option value="customer">Customer</option>
                <option value="staff">Staff</option>
                <option value="organiser">Organiser</option>
                <option value="admin">Admin</option>
              </select>
              <div class="invalid-feedback" id="roleError"></div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" autocomplete="new-password">
              <div class="form-text" id="passwordHelp">At least 8 characters.</div>
              <div class="invalid-feedback" id="passwordError"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-brand" id="saveBtn" form="userForm">Save user</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
