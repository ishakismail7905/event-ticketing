<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Upcoming events</h1>

    <!-- Search and filter -->
    <form id="searchForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" id="search" class="form-control" placeholder="Search by title or description">
      </div>
      <div class="col-md-3">
        <select id="sort" class="form-select">
          <option value="starts_at">Soonest first</option>
          <option value="title">Title</option>
          <option value="ticket_price">Price</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-brand w-100">Search</button>
      </div>
    </form>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading events...</p>
    </div>
    <div id="empty" class="text-center py-5 text-secondary d-none">No events match your search.</div>

    <div id="eventList" class="row g-3"></div>

    <nav class="mt-4 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <span id="pageInfo" class="text-secondary"></span>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
