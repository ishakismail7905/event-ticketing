<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <h1 class="h3 site-title mb-1">EventHub</h1>
      <p class="text-secondary mb-4">Log in to book, manage or check in tickets.</p>

      <!-- Messages from the API appear here -->
      <div id="message" class="alert d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required autocomplete="username">
          <div class="invalid-feedback" id="emailError"></div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
          <div class="invalid-feedback" id="passwordError"></div>
        </div>
        <button type="submit" class="btn btn-brand w-100" id="loginBtn">
          <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
          <span id="btnText">Log in</span>
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">No account? <a href="register.html">Register as a customer</a></p>
    </div>

    <p class="owner-note">Muhammad Anas &middot; AM2512021976</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
