<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3" id="pageTitle">Bookings</h1>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" id="search" class="form-control" placeholder="Search by reference, customer or event">
      </div>
      <div class="col-md-3">
        <select id="status" class="form-select">
          <option value="">All statuses</option>
          <option value="confirmed">Confirmed</option>
          <option value="checked_in">Checked in</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-brand w-100">Search</button>
      </div>
    </form>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading bookings...</p>
    </div>
    <div id="empty" class="text-center py-5 text-secondary d-none">No bookings found.</div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white d-none" id="table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Event</th>
            <th id="customerCol">Customer</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="mt-3 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <span id="pageInfo" class="text-secondary"></span>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
    </nav>
  </main>

  <!-- QR ticket popup -->
  <div class="modal fade" id="qrModal" tabindex="-1" aria-labelledby="qrTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="qrTitle">Ticket QR code</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center" id="qrBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
