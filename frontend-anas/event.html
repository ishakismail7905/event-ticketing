<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event details - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4" style="max-width: 760px">
    <a href="index.html" class="text-decoration-none">&larr; Back to events</a>

    <div id="message" class="alert d-none mt-3" role="alert"></div>
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading event...</p>
    </div>

    <div id="eventBox" class="d-none mt-3">
      <span class="badge text-bg-success mb-2" id="category"></span>
      <h1 class="h3" id="title"></h1>
      <p class="text-secondary" id="description"></p>
      <dl class="row">
        <dt class="col-sm-3">When</dt><dd class="col-sm-9" id="when"></dd>
        <dt class="col-sm-3">Venue</dt><dd class="col-sm-9" id="venue"></dd>
        <dt class="col-sm-3">Organiser</dt><dd class="col-sm-9" id="organiser"></dd>
        <dt class="col-sm-3">Price</dt><dd class="col-sm-9" id="price"></dd>
        <dt class="col-sm-3">Tickets left</dt><dd class="col-sm-9" id="tickets"></dd>
      </dl>

      <!-- Shown only to customers -->
      <form id="bookForm" class="card card-body d-none" novalidate>
        <h2 class="h5">Book tickets</h2>
        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity (1 to 10)</label>
          <input type="number" class="form-control" id="quantity" min="1" max="10" value="1" required>
          <div class="invalid-feedback" id="quantityError"></div>
        </div>
        <p class="mb-3">Total: <strong id="total"></strong></p>
        <button type="submit" class="btn btn-brand" id="bookBtn">
          <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
          <span id="btnText">Confirm booking</span>
        </button>
      </form>

      <!-- Shown to guests and to non-customer roles -->
      <div id="bookNotice" class="alert alert-secondary d-none"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
