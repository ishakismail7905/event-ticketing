<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage events - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0" id="pageTitle">My events</h1>
      <button type="button" class="btn btn-brand" id="newEventBtn">+ New event</button>
    </div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" id="search" class="form-control" placeholder="Search by title or description">
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
      </div>
    </form>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading events...</p>
    </div>
    <div id="empty" class="text-center py-5 text-secondary d-none">No events yet. Click "New event" to create one.</div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white d-none" id="table">
        <thead>
          <tr>
            <th>Event</th>
            <th>When</th>
            <th>Venue</th>
            <th>Price</th>
            <th>Tickets left</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="mt-3 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <span id="pageInfo" class="text-secondary"></span>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
    </nav>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="formTitle">New event</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="formMessage" class="alert d-none" role="alert"></div>

          <form id="eventForm" class="row g-3" novalidate>
            <div class="col-md-8">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" maxlength="150" required>
              <div class="invalid-feedback" id="titleError"></div>
            </div>
            <div class="col-md-4">
              <label for="category" class="form-label">Category</label>
              <input type="text" class="form-control" id="category" maxlength="50" placeholder="e.g. Music" required>
              <div class="invalid-feedback" id="categoryError"></div>
            </div>
            <div class="col-12">
              <label for="description" class="form-label">Description <span class="text-secondary">(optional)</span></label>
              <textarea class="form-control" id="description" rows="2"></textarea>
              <div class="invalid-feedback" id="descriptionError"></div>
            </div>
            <div class="col-12">
              <label for="venue_id" class="form-label">Venue</label>
              <select class="form-select" id="venue_id" required></select>
              <div class="invalid-feedback" id="venue_idError"></div>
            </div>
            <div class="col-md-6">
              <label for="starts_at" class="form-label">Starts</label>
              <input type="datetime-local" class="form-control" id="starts_at" required>
              <div class="invalid-feedback" id="starts_atError"></div>
            </div>
            <div class="col-md-6">
              <label for="ends_at" class="form-label">Ends</label>
              <input type="datetime-local" class="form-control" id="ends_at" required>
              <div class="invalid-feedback" id="ends_atError"></div>
            </div>
            <div class="col-md-4">
              <label for="ticket_price" class="form-label">Ticket price (RM)</label>
              <input type="number" class="form-control" id="ticket_price" min="0" step="0.01" required>
              <div class="invalid-feedback" id="ticket_priceError"></div>
            </div>
            <div class="col-md-4">
              <label for="total_tickets" class="form-label">Total tickets</label>
              <input type="number" class="form-control" id="total_tickets" min="1" step="1" required>
              <div class="invalid-feedback" id="total_ticketsError"></div>
            </div>
            <div class="col-md-4" id="statusGroup">
              <label for="status" class="form-label">Save as</label>
              <select class="form-select" id="status">
                <option value="draft">Draft (hidden)</option>
                <option value="published">Published</option>
              </select>
              <div class="invalid-feedback" id="statusError"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-brand" id="saveBtn" form="eventForm">Save event</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/manage-events.js"></script>
</body>
</html>
