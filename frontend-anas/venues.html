<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venues - EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Venues</h1>
      <button type="button" class="btn btn-brand" id="newVenueBtn">+ New venue</button>
    </div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-9">
        <input type="search" id="search" class="form-control" placeholder="Search by name, address or city">
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
      </div>
    </form>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success"></div>
      <p class="mt-2 text-secondary">Loading venues...</p>
    </div>
    <div id="empty" class="text-center py-5 text-secondary d-none">No venues found.</div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white d-none" id="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Address</th>
            <th>City</th>
            <th>Capacity</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="mt-3 d-flex justify-content-between align-items-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <span id="pageInfo" class="text-secondary"></span>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
    </nav>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="venueModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="formTitle">New venue</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="formMessage" class="alert d-none" role="alert"></div>
          <form id="venueForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" maxlength="150" required>
              <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" class="form-control" id="address" required>
              <div class="invalid-feedback" id="addressError"></div>
            </div>
            <div class="mb-3">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" required>
              <div class="invalid-feedback" id="cityError"></div>
            </div>
            <div class="mb-3">
              <label for="capacity" class="form-label">Capacity (people)</label>
              <input type="number" class="form-control" id="capacity" min="1" step="1" required>
              <div class="invalid-feedback" id="capacityError"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-brand" id="saveBtn" form="venueForm">Save venue</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/venues.js"></script>
</body>
</html>
