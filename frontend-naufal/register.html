<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 460px;">
    <h1 class="h3 mb-1 text-center">Create an account</h1>
    <p class="text-center text-muted small mb-4">Sign up as a customer to book tickets.</p>
    <div id="alert" class="alert d-none"></div>

    <form id="registerForm" class="card card-body shadow-sm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Full name *</label>
        <input id="name" name="name" class="form-control" maxlength="255" required>
        <div class="invalid-feedback" id="name-error">Name is required.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input type="email" id="email" name="email" class="form-control" required>
        <div class="invalid-feedback" id="email-error">Enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input id="phone" name="phone" class="form-control" maxlength="20" placeholder="012-345 6789">
        <div class="invalid-feedback" id="phone-error"></div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password *</label>
        <input type="password" id="password" name="password" class="form-control" minlength="8" required>
        <div class="invalid-feedback" id="password-error">At least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label for="password_confirmation" class="form-label">Confirm password *</label>
        <input type="password" id="password_confirmation" name="password_confirmation" class="form-control" required>
        <div class="invalid-feedback" id="password_confirmation-error">Passwords do not match.</div>
      </div>
      <button type="submit" id="registerBtn" class="btn btn-primary w-100">Create account</button>
      <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
