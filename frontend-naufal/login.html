<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-4 text-center">Log in</h1>
    <div id="alert" class="alert d-none"></div>

    <form id="loginForm" class="card card-body shadow-sm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
        <div class="invalid-feedback" id="email-error">Enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <div class="invalid-feedback" id="password-error">Password is required.</div>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary w-100">Log in</button>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
