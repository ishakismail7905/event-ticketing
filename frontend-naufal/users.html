<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Users</h1>
      <button id="newUserBtn" class="btn btn-primary">+ New user</button>
    </div>
    <div id="alert" class="alert d-none"></div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-5">
        <input type="search" name="search" class="form-control" placeholder="Search name or email">
      </div>
      <div class="col-md-3">
        <select name="role" class="form-select">
          <option value="">All roles</option>
          <option value="admin">Admin</option>
          <option value="organiser">Organiser</option>
          <option value="staff">Staff</option>
          <option value="customer">Customer</option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="sort" class="form-select">
          <option value="id:asc">Oldest first</option>
          <option value="created_at:desc">Newest first</option>
          <option value="name:asc">Name A–Z</option>
          <option value="role:asc">Role</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-outline-primary">Search</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Actions</th></tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>

    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="userForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalTitle">New user</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input id="name" name="name" class="form-control" maxlength="255" required>
            <div class="invalid-feedback" id="name-error">Name is required.</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input type="email" id="email" name="email" class="form-control" required>
            <div class="invalid-feedback" id="email-error">Enter a valid email.</div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="role" class="form-label">Role *</label>
              <select id="role" name="role" class="form-select" required>
                <option value="customer">Customer</option>
                <option value="staff">Staff</option>
                <option value="organiser">Organiser</option>
                <option value="admin">Admin</option>
              </select>
              <div class="invalid-feedback" id="role-error"></div>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Phone</label>
              <input id="phone" name="phone" class="form-control" maxlength="20">
              <div class="invalid-feedback" id="phone-error"></div>
            </div>
          </div>
          <div class="mt-3">
            <label for="password" class="form-label" id="passwordLabel">Password *</label>
            <input type="password" id="password" name="password" class="form-control" minlength="8">
            <div class="form-text" id="passwordHint"></div>
            <div class="invalid-feedback" id="password-error">At least 8 characters.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save user</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
