<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3" id="pageTitle">Bookings</h1>
    <div id="alert" class="alert d-none"></div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" name="search" class="form-control"
               placeholder="Search reference, customer or event">
      </div>
      <div class="col-md-4">
        <select name="status" class="form-select">
          <option value="">All statuses</option>
          <option value="confirmed">Confirmed</option>
          <option value="checked_in">Checked in</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Reference</th>
            <th>Event</th>
            <th id="customerCol">Customer</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingRows"></tbody>
      </table>
    </div>

    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
  </main>

  <!-- QR ticket popup -->
  <div class="modal fade" id="qrModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5">Your ticket</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center" id="qrBody"></div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

  <!-- Bootstrap JS is needed for the modal -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
