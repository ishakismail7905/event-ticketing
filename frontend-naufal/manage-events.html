<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage events | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0" id="pageTitle">My events</h1>
      <a href="event-form.html" class="btn btn-primary">+ New event</a>
    </div>
    <div id="alert" class="alert d-none"></div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-6">
        <input type="search" name="search" class="form-control" placeholder="Search title or description">
      </div>
      <div class="col-md-4">
        <select name="status" class="form-select">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-outline-primary">Search</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Tickets left</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventRows"></tbody>
      </table>
    </div>

    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
  </main>

  <footer id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/manage-events.js"></script>
</body>
</html>
