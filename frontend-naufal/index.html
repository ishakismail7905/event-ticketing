<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div id="alert" class="alert d-none"></div>

    <h1 class="h3 mb-3">Upcoming events</h1>

    <!-- Search, filter and sort -->
    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-5">
        <input type="search" name="search" class="form-control" placeholder="Search title or description">
      </div>
      <div class="col-md-3">
        <select name="category" class="form-select">
          <option value="">All categories</option>
          <option>Music</option>
          <option>Conference</option>
          <option>Theatre</option>
          <option>Festival</option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="sort" class="form-select">
          <option value="starts_at:asc">Soonest first</option>
          <option value="ticket_price:asc">Price: low to high</option>
          <option value="ticket_price:desc">Price: high to low</option>
          <option value="title:asc">Title A–Z</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <p class="text-muted small" id="resultInfo"></p>
    <div id="eventList" class="row g-3"></div>

    <nav class="mt-4">
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
  </main>

  <footer id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
