<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venues | EventHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Venues</h1>
      <button id="newVenueBtn" class="btn btn-primary">+ New venue</button>
    </div>
    <div id="alert" class="alert d-none"></div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-md-5">
        <input type="search" name="search" class="form-control" placeholder="Search name, address or city">
      </div>
      <div class="col-md-3">
        <input type="number" name="min_capacity" class="form-control" min="1" placeholder="Min capacity">
      </div>
      <div class="col-md-2">
        <select name="sort" class="form-select">
          <option value="name:asc">Name A–Z</option>
          <option value="capacity:desc">Biggest first</option>
          <option value="capacity:asc">Smallest first</option>
          <option value="city:asc">City A–Z</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-outline-primary">Search</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr><th>Name</th><th>Address</th><th>City</th><th>Capacity</th><th>Actions</th></tr>
        </thead>
        <tbody id="venueRows"></tbody>
      </table>
    </div>

    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="venueModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="venueForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalTitle">New venue</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input id="name" name="name" class="form-control" maxlength="150" required>
            <div class="invalid-feedback" id="name-error">Name is required (max 150 characters).</div>
          </div>
          <div class="mb-3">
            <label for="address" class="form-label">Address *</label>
            <input id="address" name="address" class="form-control" required>
            <div class="invalid-feedback" id="address-error">Address is required.</div>
          </div>
          <div class="row g-3">
            <div class="col-md-7">
              <label for="city" class="form-label">City *</label>
              <input id="city" name="city" class="form-control" required>
              <div class="invalid-feedback" id="city-error">City is required.</div>
            </div>
            <div class="col-md-5">
              <label for="capacity" class="form-label">Capacity *</label>
              <input type="number" id="capacity" name="capacity" class="form-control" min="1" required>
              <div class="invalid-feedback" id="capacity-error">At least 1.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save venue</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/venues.js"></script>
</body>
</html>
